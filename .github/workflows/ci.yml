name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  # Corre os testes nos tres sistemas. A ERA promete rodar em qualquer
  # lugar; isso so e verdade se for testado em qualquer lugar.
  test:
    name: Testes / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: Testes
        run: go test -count=1 -shuffle=on ./...

  # O detector de corrida, que nao roda na maquina do desenvolvedor por
  # falta de compilador C. Os kernels dividem trabalho entre goroutines que
  # escrevem no mesmo buffer de saida -- separadas por faixas de linhas, mas
  # isso e uma afirmacao que precisa ser verificada, nao assumida.
  race:
    name: Detector de corrida
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: Testes com -race
        run: go test -race -count=1 ./...

      # Repete varias vezes: corrida e bug probabilistico, e uma passada
      # limpa nao prova nada.
      - name: Testes com -race, 5 repeticoes
        run: go test -race -count=5 ./kernel/

  lint:
    name: Formatacao e vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: gofmt
        run: |
          nao_formatados=$(gofmt -l .)
          if [ -n "$nao_formatados" ]; then
            echo "Estes arquivos nao passaram pelo gofmt:"
            echo "$nao_formatados"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy nao deixa diferenca
        run: |
          go mod tidy
          if ! git diff --exit-code; then
            echo "go mod tidy alterou arquivos; rode-o e comite o resultado"
            exit 1
          fi

  # A ERA promete zero dependencias. Promessa sem verificacao e so
  # intencao: basta um "go get" distraido para quebra-la em silencio.
  dependencias:
    name: Zero dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: Nenhuma dependencia externa
        run: |
          deps=$(go list -m all | tail -n +2)
          if [ -n "$deps" ]; then
            echo "A ERA deve depender apenas da biblioteca padrao. Encontrei:"
            echo "$deps"
            exit 1
          fi
          echo "ok: zero dependencias"

      - name: Nenhum uso de cgo
        run: |
          if grep -rn --include='*.go' -E '^[[:space:]]*import "C"' .; then
            echo "cgo encontrado; a ERA precisa compilar sem ele"
            exit 1
          fi
          echo "ok: sem cgo"

  # Sem cgo, um pacote Go cross-compila para qualquer alvo. Essa e a razao
  # principal de nao termos escolhido C++ -- entao e uma promessa que
  # merece ser testada a cada push, e nao descoberta quebrada meses depois.
  crosscompile:
    name: Cross-compile / ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm } # Raspberry Pi 32 bits
          - { goos: linux, goarch: riscv64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: android, goarch: arm64 }
          - { goos: js, goarch: wasm }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: Compilar
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  # Informativo. Runners compartilhados variam demais para servir de porta
  # de qualidade, mas uma regressao catastrofica aparece no log.
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: Rodar benchmarks
        run: go test ./kernel/ -run='^$' -bench=. -benchtime=20x
